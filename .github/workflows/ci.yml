name: CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================================
  # CI
  # ==========================================================
  checks:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      GROQ_API_KEY: ci-test-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check Python syntax
        run: python -m compileall -q app evals tests ui main.py

      - name: Check for coding errors
        run: >
          python -m ruff check
          app evals tests ui main.py
          --select E9,F63,F7,F82
          --output-format github

      - name: Run chunking tests
        run: python -m unittest discover -s tests -p 'test_chunking.py' -v

      - name: Run ingestion tests
        run: python -m unittest discover -s tests -p 'test_ingestion.py' -v

      - name: Run retrieval tests
        run: python -m unittest discover -s tests -p 'test_hybrid.py' -v

      - name: Run guardrail tests
        run: python -m unittest discover -s tests -p 'test_guardrails.py' -v

      - name: Run DeepEval regression tests
        run: python -m unittest discover -s tests -p 'test_deepeval_suite.py' -v

      - name: Build Docker image
        run: docker build -t production-grade-rag-app:ci .

      - name: Smoke test Docker image
        run: |
          docker run --rm \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            production-grade-rag-app:ci \
            python -c "import main; print('Docker application import OK')"

  # ==========================================================
  # CD
  # Runs only after CI passes AND code is pushed to main
  # ==========================================================
  deploy:
    name: Deploy to AWS EC2
    needs: checks

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: production-grade-rag-app
      EC2_INSTANCE_ID: i-0b39ed9be69a030e1
      CONTAINER_NAME: production-rag-app

    steps:
      # ------------------------------------------------------
      # 1. Checkout production commit
      # ------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # ------------------------------------------------------
      # 2. GitHub OIDC -> temporary AWS credentials
      # ------------------------------------------------------
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::628088981748:role/production-rag-github-role
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "628088981748"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ------------------------------------------------------
      # 3. Login GitHub runner to ECR
      # ------------------------------------------------------
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------
      # 4. Prepare ARM64 Docker build
      #
      # EC2 = t4g.small = ARM64
      # GitHub runner = normally x86_64
      # QEMU allows cross-architecture build.
      # ------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ------------------------------------------------------
      # 5. Build ARM64 image and push to ECR
      #
      # Two tags:
      # - commit SHA = exact immutable deployment version
      # - latest     = convenience tag
      # ------------------------------------------------------
      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      # ------------------------------------------------------
      # 6. Create deployment script for EC2
      #
      # We send this script through AWS Systems Manager.
      # No SSH key is stored in GitHub.
      # ------------------------------------------------------
      - name: Prepare EC2 deployment command
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import shlex

          image_uri = os.environ["IMAGE_URI"]
          registry = os.environ["ECR_REGISTRY"]
          region = os.environ["AWS_REGION"]
          container = os.environ["CONTAINER_NAME"]

          script = f"""#!/usr/bin/env bash
          set -Eeuo pipefail

          IMAGE_URI={shlex.quote(image_uri)}
          ECR_REGISTRY={shlex.quote(registry)}
          AWS_REGION={shlex.quote(region)}
          CONTAINER_NAME={shlex.quote(container)}
          ENV_FILE=/home/ec2-user/.env

          echo "Starting deployment of $IMAGE_URI"

          # --------------------------------------------------
          # Verify runtime environment file exists
          # --------------------------------------------------
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: $ENV_FILE does not exist."
            exit 1
          fi

          # --------------------------------------------------
          # Preserve the currently-running image for rollback
          # --------------------------------------------------
          OLD_IMAGE_ID="$(docker inspect -f '{{{{.Image}}}}' "$CONTAINER_NAME" 2>/dev/null || true)"

          if [ -n "$OLD_IMAGE_ID" ]; then
            echo "Saving current image as rollback image..."
            docker tag "$OLD_IMAGE_ID" production-rag-app:rollback
          fi

          # --------------------------------------------------
          # Login EC2 Docker client to ECR
          #
          # EC2 receives credentials from:
          # production-rag-ec2-role
          # --------------------------------------------------
          echo "Logging in to ECR..."

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

          # --------------------------------------------------
          # Pull exact image generated from this Git commit
          # --------------------------------------------------
          echo "Pulling $IMAGE_URI..."

          docker pull "$IMAGE_URI"

          # --------------------------------------------------
          # Remove current container
          # --------------------------------------------------
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          # --------------------------------------------------
          # Start new application
          #
          # Existing runtime secrets stay on EC2.
          # They are NOT stored in GitHub.
          # --------------------------------------------------
          echo "Starting new container..."

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 8000:8000 \
            --env-file "$ENV_FILE" \
            "$IMAGE_URI"

          # --------------------------------------------------
          # Health check
          #
          # FastAPI "/" endpoint should return HTTP 200.
          # Allow up to ~2 minutes for startup.
          # --------------------------------------------------
          echo "Waiting for application health check..."

          HEALTHY=0

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              HEALTHY=1
              break
            fi

            echo "Health check attempt $attempt/60..."
            sleep 2
          done

          # --------------------------------------------------
          # Roll back automatically if deployment is unhealthy
          # --------------------------------------------------
          if [ "$HEALTHY" -ne 1 ]; then
            echo "ERROR: New container failed health check."
            echo "Rolling back..."

            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

            if docker image inspect production-rag-app:rollback >/dev/null 2>&1; then

              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                -p 8000:8000 \
                --env-file "$ENV_FILE" \
                production-rag-app:rollback

              echo "Previous image restored."
            else
              echo "ERROR: No rollback image is available."
            fi

            exit 1
          fi

          echo "Deployment successful."
          echo "Running image: $IMAGE_URI"

          docker ps --filter "name=$CONTAINER_NAME"

          # Remove unused dangling images.
          # The rollback image remains because it has a tag.
          docker image prune -f
          """

          encoded = base64.b64encode(script.encode()).decode()

          commands = [
              (
                  "printf '%s' "
                  + shlex.quote(encoded)
                  + " | base64 -d > /tmp/production-rag-deploy.sh"
              ),
              "chmod 700 /tmp/production-rag-deploy.sh",
              "bash /tmp/production-rag-deploy.sh",
              "rm -f /tmp/production-rag-deploy.sh",
          ]

          with open("ssm-params.json", "w") as f:
              json.dump({"commands": commands}, f)
          PY

      # ------------------------------------------------------
      # 7. Send deployment command to EC2 through SSM
      # ------------------------------------------------------
      - name: Deploy image to EC2 through SSM
        run: |
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy production RAG commit $GITHUB_SHA" \
            --timeout-seconds 900 \
            --parameters file://ssm-params.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $COMMAND_ID"

          STATUS=""

          # Wait up to 15 minutes.
          # SSM is eventually consistent, so the command may not
          # appear immediately after send-command.
          for attempt in $(seq 1 180); do

            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text \
              2>/dev/null || true)"

            echo "Deployment status: ${STATUS:-waiting}"

            case "$STATUS" in
              Success)
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{
                    Status:Status,
                    Output:StandardOutputContent,
                    Error:StandardErrorContent
                  }' \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment timed out while waiting for SSM."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json || true

            exit 1
          fi

          # --------------------------------------------------
          # Print final deployment result
          # --------------------------------------------------
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{
              Status:Status,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }' \
            --output json

      # ------------------------------------------------------
      # 8. Final confirmation in GitHub Actions
      # ------------------------------------------------------
      - name: Deployment completed
        run: |
          echo "Production deployment completed successfully."
          echo "Commit: $GITHUB_SHA"