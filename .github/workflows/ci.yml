name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GROQ_API_KEY: ci-test-key

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check Python syntax
        run: python -m compileall -q app evals tests ui main.py

      - name: Check for coding errors
        run: >
          python -m ruff check
          app evals tests ui main.py
          --select E9,F63,F7,F82
          --output-format github

      - name: Run chunking tests
        run: python -m unittest discover -s tests -p 'test_chunking.py' -v

      - name: Run ingestion tests
        run: python -m unittest discover -s tests -p 'test_ingestion.py' -v

      - name: Run retrieval tests
        run: python -m unittest discover -s tests -p 'test_hybrid.py' -v

      - name: Run guardrail tests
        run: python -m unittest discover -s tests -p 'test_guardrails.py' -v

      - name: Run evaluation regression tests
        run: python -m unittest discover -s tests -p 'test_evals.py' -v